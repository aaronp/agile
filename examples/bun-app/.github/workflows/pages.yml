# Publishes board/ to GitHub Pages (no Jekyll, so board.md is served raw
# for the app to fetch), with badge.svg and card.json beside it.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install && make snapshot AGILE_SRC=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/board.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: board
      - id: deployment
        uses: actions/deploy-pages@v4
